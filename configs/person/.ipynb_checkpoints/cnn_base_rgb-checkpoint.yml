# config\defaults_base.py
MODEL:
  NAME: 'RN50'
  NECK: 'bnneck'
  ID_LOSS_WEIGHT : 1.0
  TRIPLET_LOSS_WEIGHT : 1.0
  METRIC_LOSS_TYPE: 'triplet'
  DIST_TRAIN: False
  NO_MARGIN: False
  IF_LABELSMOOTH: 'on'
  COS_LAYER: False
  STRIDE_SIZE: [16,16]
  # SIE
  SIE_COE: 3.0
  SIE_CAMERA: False
  SIE_VIEW: False

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  seq_len: 4
  sample_stride: 8

DATALOADER:
  NUM_WORKERS: 8
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4

SOLVER:
  OPTIMIZER_NAME: 'Adam'
  MAX_EPOCHS: 240
  BASE_LR: 0.00035
  LARGE_FC_LR: False
  BIAS_LR_FACTOR: 2
  SEED: 1234
  MOMENTUM : 0.9
  MARGIN : 0.3
  CENTER_LR : 0.5
  CENTER_LOSS_WEIGHT : 0.0005

  WEIGHT_DECAY : 0.0005
  WEIGHT_DECAY_BIAS : 0.0005

  GAMMA : 0.1
  STEPS : (60, 120, 180) #[60, 120, 180]
  WARMUP_FACTOR : 0.01

  WARMUP_ITERS : 500
  WARMUP_METHOD : 'linear'

  COSINE_MARGIN : 0.5
  COSINE_SCALE : 30

  # CHECKPOINT_PERIOD : 60
  # LOG_PERIOD : 30

  # EVAL_PERIOD : 10
  IMS_PER_BATCH : 32

TEST:
  IMS_PER_BATCH: 32
  RE_RANKING: False
  WEIGHT: 'res/cnn_base_vid/RN50_120.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  DIST_MAT: 'dist_mat.npy'
  EVAL: True

DATASETS:
  NAMES: ('mars')
  ROOT_DIR: ('../data')

OUTPUT_DIR: 'res/cnn_base_vid'

# CUDA_VISIBLE_DEVICES:0 python train.py --config_file configs/person/cnn_base.yml
