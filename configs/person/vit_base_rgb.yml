MODEL:
  NAME: 'ViT-B-16'
  NECK: 'bnneck'
  ID_LOSS_WEIGHT : 4.0
  TRIPLET_LOSS_WEIGHT : 0.5
  METRIC_LOSS_TYPE: 'triplet'
  DIST_TRAIN: False
  NO_MARGIN: False
  IF_LABELSMOOTH: 'on'
  COS_LAYER: False
  STRIDE_SIZE: [16,16]
  # SIE
  # SIE_COE: 1.0
  # SIE_CAMERA: True
  SIE_VIEW: False
  TRAIN_MODE: True
  RESUME: True
  CHECKPOINT: 'res/vit_rgb_lrD/model_0000.pth'
  CHECKPOINT_EPOCH: 0

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  seq_len: 4
  sample_stride: 8


  # PROB: 0.5 # random horizontal flip
  # RE_PROB: 0.5 # random erasing
  # PADDING: 10
  # PIXEL_MEAN: [0.5, 0.5, 0.5]
  # PIXEL_STD: [0.5, 0.5, 0.5]

DATALOADER:
  NUM_WORKERS: 4
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4

SOLVER:
  OPTIMIZER_NAME: 'Adam'
  MAX_EPOCHS: 160
  BASE_LR: 0.001 # 基础学习率
  LARGE_FC_LR: False
  BIAS_LR_FACTOR: 2 
  SEED: 1234
  MOMENTUM : 0.9
  MARGIN : 0.3
  CENTER_LR : 0.5
  CENTER_LOSS_WEIGHT : 0.0005

  WEIGHT_DECAY : 0.0005
  WEIGHT_DECAY_BIAS : 0.0005

  GAMMA : 0.1 # 学习率衰减因子 
  STEPS : (70, 110, 130)
  WARMUP_FACTOR : 0.0005

  WARMUP_ITERS : 3 # 约2.5个epoch
  WARMUP_METHOD : 'linear'

  COSINE_MARGIN : 0.5
  COSINE_SCALE : 30

  CHECKPOINT_PERIOD : 20
  LOG_PERIOD : 40

  EVAL_PERIOD : 40
  IMS_PER_BATCH : 32
  
TEST:
  IMS_PER_BATCH: 32
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  DIST_MAT: 'dist_mat.npy'
  EVAL: True

DATASETS:
  NAMES: ('mars')
  ROOT_DIR: ('../data')
OUTPUT_DIR: 'res/vit_rgb_lrD'
