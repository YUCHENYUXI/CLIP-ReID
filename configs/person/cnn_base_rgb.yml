# config\defaults_base.py
MODEL:
  # HW
  DEVICE_ID: '0'

  # Model
  NAME: 'resnet50'
  # LAST_STRIDE: 1
  # PRETRAIN_PATH: 'pretrained_models'
  # PRETRAIN_CHOICE: 'imagenet'

  # train
  NECK: 'bnneck'
  # IF_WITH_CENTER: 'no'

  # loss_weight
  # ID_LOSS_TYPE: 'softmax'
  ID_LOSS_WEIGHT : 1.0
  TRIPLET_LOSS_WEIGHT : 1.0
  # I2I_LOSS_WEIGHT : 1.0

  # metric
  METRIC_LOSS_TYPE: 'triplet'
  DIST_TRAIN: False
  NO_MARGIN: False
  IF_LABELSMOOTH: 'on'
  COS_LAYER: False

  # tf
  # DROP_PATH: 0.1
  # DROP_OUT: 0.0
  # ATT_DROP_RATE: 0.0
  # TRANSFORMER_TYPE: 'None'
  STRIDE_SIZE: [16,16]

  # sie
  SIE_COE: 3.0
  SIE_CAMERA: False
  SIE_VIEW: False

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  # PROB: 0.5 # random horizontal flip
  # RE_PROB: 0.5 # random erasing
  # PIXEL_MEAN: [0.485, 0.456, 0.406]
  # PIXEL_STD: [0.229, 0.224, 0.225]
  # PADDING: 10
  seq_len: 4
  sample_stride: 4


DATALOADER:
  NUM_WORKERS: 4
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4

SOLVER:
  OPTIMIZER_NAME: 'Adam'
  MAX_EPOCHS: 120
  BASE_LR: 0.00035
  LARGE_FC_LR: False
  BIAS_LR_FACTOR: 2
  SEED: 1234
  MOMENTUM : 0.9
  MARGIN : 0.3
  CENTER_LR : 0.5
  CENTER_LOSS_WEIGHT : 0.0005

  WEIGHT_DECAY : 0.0005
  WEIGHT_DECAY_BIAS : 0.0005

  GAMMA : 0.1
  STEPS : (40, 70)
  WARMUP_FACTOR : 0.01
  # WARMUP_EPOCHS : 5
  # WARMUP_LR_INIT : 0.01
  # LR_MIN : 0.000016

  WARMUP_ITERS : 500
  WARMUP_METHOD : 'linear'

  COSINE_MARGIN : 0.5
  COSINE_SCALE : 30

  CHECKPOINT_PERIOD : 10
  LOG_PERIOD : 100

  EVAL_PERIOD : 10
  IMS_PER_BATCH : 64

TEST:
  IMS_PER_BATCH: 32
  RE_RANKING: False
  WEIGHT: 'res/cnn_base_vid/RN50_120.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  DIST_MAT: 'dist_mat.npy'
  EVAL: True

DATASETS:
  NAMES: ('mars')
  ROOT_DIR: ('../data')

OUTPUT_DIR: 'res/cnn_base_vid'

# CUDA_VISIBLE_DEVICES:0 python train.py --config_file configs/person/cnn_base.yml
