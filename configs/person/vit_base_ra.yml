MODEL:
  NAME: 'ViT-B-16'
  NECK: 'bnneck'
  ID_LOSS_WEIGHT : 1.
  TRIPLET_LOSS_WEIGHT : 1.
  METRIC_LOSS_TYPE: 'triplet'
  DIST_TRAIN: False
  NO_MARGIN: False
  IF_LABELSMOOTH: 'on'
  COS_LAYER: False
  STRIDE_SIZE: [16,16]
  # SIE
  # SIE_COE: 1.0
  # SIE_CAMERA: True
  SIE_VIEW: False
  TRAIN_MODE: True
  IS_USE_CKPT: False
  CKPT_PATH: ''
  LAST_OR_NEW_CKPT_EPOCH_MARK: 0

INPUT:
  SIZE_TRAIN: [224, 224]
  SIZE_TEST: [224, 224]
  seq_len: 6
  sample_stride: 3



DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 2

SOLVER:
  OPTIMIZER_NAME: 'Adam'
  MAX_EPOCHS: 240
  BASE_LR: 0.0005 
  LARGE_FC_LR: False
  BIAS_LR_FACTOR: 2
  SEED: 1234
  MOMENTUM : 0.9
  MARGIN : 0.3
  CENTER_LR : 0.5
  CENTER_LOSS_WEIGHT : 0.0005

  WEIGHT_DECAY : 0.0005
  WEIGHT_DECAY_BIAS : 0.0005

  GAMMA : 0.1 
  STEPS : (100,180,210)
  WARMUP_FACTOR : 0.1

  WARMUP_ITERS : 3 # epo
  WARMUP_METHOD : 'linear'

  COSINE_MARGIN : 0.5
  COSINE_SCALE : 30

  VIDS_PER_BATCH : 16
  
TEST:
  VIDS_PER_BATCH: 16
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  DIST_MAT: 'dist_mat.npy'
  EVAL: True

DATASETS:
  NAMES: ('aer_video')
  ROOT_DIR: ('../data')
OUTPUT_DIR: 'res/raDebug'
